name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --win --x64
            artifact: windows-x64
          # macOS Apple Silicon build disabled in this fork. To re-enable, uncomment these
          # lines and the two mac-arm64 names in the release check below.
          # - name: macOS Apple Silicon
          #   os: macos-15
          #   args: --mac --arm64
          #   artifact: mac-arm64
          - name: macOS Intel
            os: macos-15-intel
            args: --mac --x64
            artifact: mac-x64
            # Hosted Intel Macs have no GPU and cannot create the WebGL view, so this
            # build is packaged without running the suites.
            skip_tests: true
          - name: Linux x64
            os: ubuntu-24.04
            args: --linux --x64
            artifact: linux-x64
            # Hosted Linux runners have no display, so the suites run under Xvfb.
            test_prefix: xvfb-run -a
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Read version and check release tag
        id: version
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const { version } = require(process.cwd() + '/package.json');
          if (process.env.GITHUB_REF.startsWith('refs/tags/') && process.env.GITHUB_REF_NAME !== 'v' + version) {
            throw new Error('Release tag must match package.json version: v' + version);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + version + '\n');
      - run: npm ci
      - name: Allow the Chromium sandbox on the Linux runner
        if: runner.os == 'Linux'
        # Ubuntu 24.04 blocks unprivileged user namespaces, which Electron's sandbox
        # needs when its helper is not installed setuid. This affects the runner only.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test all workspaces offline
        if: ${{ !matrix.skip_tests }}
        run: ${{ matrix.test_prefix }} npm run test:all
      - name: Build without tests
        if: ${{ matrix.skip_tests }}
        run: npm run build
      - name: Package apps without publishing
        if: github.event_name != 'pull_request'
        run: npx --no-install electron-builder ${{ matrix.args }} --publish never
      - name: Test packaged apps offline
        if: ${{ github.event_name != 'pull_request' && !matrix.skip_tests }}
        run: ${{ matrix.test_prefix }} npm run test:packaged
      - name: Upload distributables
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DabbleCAD-${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: |
            release/${{ steps.version.outputs.version }}/DabbleCAD-*.exe
            release/${{ steps.version.outputs.version }}/DabbleCAD-*.zip
            release/${{ steps.version.outputs.version }}/DabbleCAD-*.dmg
            release/${{ steps.version.outputs.version }}/DabbleCAD-*.AppImage

  draft-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: DabbleCAD-*
          path: release-assets
          merge-multiple: true
      - name: Verify all five artifacts and generate checksums
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = require('node:path');
          const { createHash } = require('node:crypto');
          const { version } = require(process.cwd() + '/package.json');
          const names = [
            `DabbleCAD-${version}-win-x64-setup.exe`,
            `DabbleCAD-${version}-win-x64.zip`,
            // `DabbleCAD-${version}-mac-arm64.dmg`, (Apple Silicon build disabled)
            // `DabbleCAD-${version}-mac-arm64.zip`,
            `DabbleCAD-${version}-mac-x64.dmg`,
            `DabbleCAD-${version}-mac-x64.zip`,
            `DabbleCAD-${version}-linux-x64.AppImage`,
          ].sort();
          const actual = fs.readdirSync('release-assets').sort();
          if (JSON.stringify(actual) !== JSON.stringify(names)) {
            throw new Error('Unexpected or missing release artifacts: ' + actual.join(', '));
          }
          const lines = names.map((name) => {
            const data = fs.readFileSync(path.join('release-assets', name));
            if (!data.length) throw new Error('Empty artifact: ' + name);
            return createHash('sha256').update(data).digest('hex') + '  ' + name;
          });
          fs.writeFileSync('release-assets/SHA256SUMS.txt', lines.join('\n') + '\n');
      - name: Create draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "DabbleCAD $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
